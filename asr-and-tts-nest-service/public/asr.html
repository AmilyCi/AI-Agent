<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASR 录音测试</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.6;
      }
      button {
        margin-right: 8px;
        margin-bottom: 8px;
        padding: 8px 14px;
      }
      .status {
        margin: 12px 0;
        color: #444;
      }
      pre {
        background: #f6f8fa;
        padding: 12px;
        border-radius: 6px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>ASR 录音上传测试</h1>
    <p>点击开始录音，结束后自动上传到 <code>/speech/asr</code>。</p>

    <button id="startBtn">开始录音</button>
    <button id="stopBtn" disabled>停止并上传</button>
    <div class="status" id="status">状态：未开始</div>
    <h3>识别结果</h3>
    <pre id="result">（暂无）</pre>

    <script>
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');

      let mediaRecorder = null;
      let chunks = [];
      const recordFilename = 'record.ogg';

      function setStatus(text) {
        statusEl.textContent = '状态：' + text;
      }

      startBtn.addEventListener('click', async () => {
        try {
          // 请求麦克风权限 getUserMedia
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          // 创建录音器，优先用 ogg 格式
          // isTypeSupported - 检测浏览器是否支持 ogg 格式，不支持就用默认格式
          chunks = [];
          const preferredMimeType = 'audio/ogg;codecs=opus';
          mediaRecorder = MediaRecorder.isTypeSupported(preferredMimeType)
            ? new MediaRecorder(stream, { mimeType: preferredMimeType })
            : new MediaRecorder(stream);

          // 录音碎片回调
          mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              chunks.push(event.data);
            }
          };

          // 停止录音后自动上传
          mediaRecorder.onstop = async () => {
            setStatus('录音结束，正在上传...');
            try {
              // 把碎片合成一个 Blob
              const blob = new Blob(chunks, {
                type: mediaRecorder.mimeType || 'audio/webm',
              });
              if (!blob.size) {
                throw new Error('录音数据为空，请至少录制 1 秒再上传');
              }
              // 包装成 FormData
              const formData = new FormData();
              formData.append('audio', blob, recordFilename);

              // 上传到 /speech/asr
              const response = await fetch('/speech/asr', {
                method: 'POST',
                body: formData,
              });

              if (!response.ok) {
                const text = await response.text();
                throw new Error(text || '请求失败');
              }

              // 显示结果
              const data = await response.json();
              resultEl.textContent = data.text || '（空结果）';
              setStatus('上传完成');
            } catch (error) {
              setStatus('上传失败');
              resultEl.textContent =
                '错误：' + (error.message || String(error));
            } finally {
              stream.getTracks().forEach((t) => t.stop());
            }
          };

          // 开始录音
          mediaRecorder.start(250); // 每 250ms 触发一次 ondataavailable
          setStatus('录音中...');
          startBtn.disabled = true;
          stopBtn.disabled = false;
        } catch (error) {
          setStatus('无法开始录音');
          resultEl.textContent = '错误：' + (error.message || String(error));
        }
      });

      stopBtn.addEventListener('click', () => {
        if (!mediaRecorder) return;
        mediaRecorder.stop(); // 停止录音，触发 onstop 自动上传
        startBtn.disabled = false;
        stopBtn.disabled = true;
      });
    </script>
  </body>
</html>
